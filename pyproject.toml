[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "honestenv"
dynamic = ["version"]
description = "A Harbor-compatible factory for verifiable agent tasks"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["Harbor", "evaluation tasks", "quality gates"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = ["harbor==0.27.0"]

[project.urls]
Homepage = "https://github.com/EZfan/honestenv"
Repository = "https://github.com/EZfan/honestenv"
Issues = "https://github.com/EZfan/honestenv/issues"
Changelog = "https://github.com/EZfan/honestenv/blob/main/CHANGELOG.md"

[project.scripts]
honestenv = "honestenv.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "honestenv.__version__"}
