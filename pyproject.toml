[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "honestenv"
version = "0.0.0"
description = "A Harbor-compatible factory for verifiable agent tasks"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["harbor==0.27.0"]

[project.urls]
Homepage = "https://github.com/EZfan/honestenv"
Repository = "https://github.com/EZfan/honestenv"
Issues = "https://github.com/EZfan/honestenv/issues"
Changelog = "https://github.com/EZfan/honestenv/blob/main/CHANGELOG.md"

[project.scripts]
honestenv = "honestenv.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
